<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<title>Merry Christmas · To 甘永</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05060d; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #c { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #c.dragging { cursor:grabbing; }
  .card { position:fixed; left:6vw; top:30%; pointer-events:none; user-select:none; }
  .card .l1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 5.0vw, 46px);
    letter-spacing:.02em; color:#fff;
    text-shadow: 0 0 16px rgba(255,255,255,.6), 0 0 46px rgba(150,195,255,.4);
  }
  .card .l2 {
    margin-top:.55em;
    font-size: clamp(14px, 3.0vw, 26px);
    color:#e4edff;
    text-shadow: 0 0 14px rgba(180,215,255,.55);
  }
  #hint {
    position:fixed; left:0; right:0; bottom: max(14px, env(safe-area-inset-bottom));
    text-align:center; font-size:13px; color:#9fb0cc; opacity:.85;
    transition:opacity 1.2s ease; pointer-events:none;
  }
  #hint.hide { opacity:0; }
  #err {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:#c9d6ee; font-size:15px; line-height:1.8;
  }
  #err.show { display:flex; }
  @media (max-width: 820px) and (orientation: portrait) {
    .card { left: 8vw; top: 7%; }
    .card .l1 { font-size: clamp(20px, 6.6vw, 34px); }
    .card .l2 { font-size: clamp(13px, 4.2vw, 20px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="card">
  <div class="l1">Merry Christmas</div>
  <div class="l2">To 甘永天天开心</div>
</div>

<div id="hint">拖动旋转 · 滚轮 / 双指缩放</div>
<div id="err"><div>你的浏览器没有启用 WebGL<br>试试 Chrome、Edge 或新版 Safari</div></div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, powerPreference: "high-performance" })
        || canvas.getContext("webgl", { antialias: false, alpha: false, depth: false, powerPreference: "high-performance" })
        || canvas.getContext("experimental-webgl", { antialias: false, alpha: false, depth: false });

  if (!gl) {
    document.getElementById("err").classList.add("show");
    return;
  }

  var isWebGL2 = (typeof WebGL2RenderingContext !== "undefined") && (gl instanceof WebGL2RenderingContext);
  var floatOK = false;
  if (isWebGL2) {
    floatOK = !!(gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float"));
  } else {
    floatOK = !!(gl.getExtension("OES_texture_half_float") && gl.getExtension("OES_texture_half_float_linear"));
  }

  var isMobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent);
  var params = new URLSearchParams(location.search);
  var quality = params.get("q") || (isMobile ? "low" : "high");

  var CFG = quality === "high"
    ? { tree: 300000, trunk: 10000, heart: 30000, ground: 110000, stars: 3400, snow: 20000, dprCap: 2.0 }
    : { tree: 130000, trunk: 5000, heart: 16000, ground: 50000, stars: 2000, snow: 10000, dprCap: 1.6 };

  /* -------------------------------------------------------------- 矩阵工具 */
  function perspective(fovyDeg, aspect, near, far) {
    var f = 1 / Math.tan(fovyDeg * Math.PI / 360);
    var nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function lookAt(ex, ey, ez, tx, ty, tz, ux, uy, uz) {
    var zx = ex - tx, zy = ey - ty, zz = ez - tz;
    var zl = Math.hypot(zx, zy, zz) || 1; zx /= zl; zy /= zl; zz /= zl;
    var xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
    var xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * ex + xy * ey + xz * ez),
      -(yx * ex + yy * ey + yz * ez),
      -(zx * ex + zy * ey + zz * ez),
      1
    ]);
  }

  /* ---------------------------------------------------------------- 着色器 */
  var VS_POINTS = [
    "precision highp float;",
    "attribute vec3 aPos;",
    "attribute vec3 aCol;",
    "attribute float aSize;",
    "attribute float aPhase;",
    "attribute float aSpeed;",
    "uniform mat4 uView;",
    "uniform mat4 uProj;",
    "uniform float uTime;",
    "uniform float uScale;",
    "varying vec3 vCol;",
    "varying float vFade;",
    "void main(){",
    "  vec3 p = aPos;",
    "  if (aSpeed > 0.0) {",
    "    p.y = mod(p.y - uTime * aSpeed, 7.2) - 0.45;",
    "    p.x += sin(uTime * 0.6 + aPhase * 6.283) * 0.18;",
    "    p.z += cos(uTime * 0.5 + aPhase * 5.1) * 0.18;",
    "  }",
    "  vec4 mv = uView * vec4(p, 1.0);",
    "  gl_Position = uProj * mv;",
    "  float tw = 0.62 + 0.5 * sin(uTime * 2.0 + aPhase * 6.2831);",
    "  vFade = clamp(0.55 + 0.55 * tw, 0.0, 1.15);",
    "  float px = aSize * uScale / max(0.05, -mv.z);",
    "  gl_PointSize = clamp(px * (0.86 + 0.28 * tw), 1.0, 64.0);",
    "  vCol = aCol;",
    "}"
  ].join("\n");

  var FS_POINTS = [
    "precision mediump float;",
    "varying vec3 vCol;",
    "varying float vFade;",
    "void main(){",
    "  vec2 d = gl_PointCoord - vec2(0.5);",
    "  float r = length(d) * 2.0;",
    "  if (r > 1.0) discard;",
    "  float a = 1.0 - r;",
    "  a = a * a * (0.35 + 0.65 * a);",   // 更柔和的光斑边缘
    "  gl_FragColor = vec4(vCol * a * vFade, 1.0);",
    "}"
  ].join("\n");

  var VS_QUAD = [
    "precision highp float;",
    "attribute vec2 aP;",
    "varying vec2 vUv;",
    "void main(){",
    "  vUv = aP * 0.5 + vec2(0.5);",
    "  gl_Position = vec4(aP, 0.0, 1.0);",
    "}"
  ].join("\n");

  // 背景：深蓝夜空 + 顶部紫色星云光晕
  var FS_BG = [
    "precision mediump float;",
    "uniform vec2 uRes;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec2 p = vUv - vec2(0.5, 0.66);",
    "  p.x *= uRes.x / max(1.0, uRes.y);",
    "  float d = length(p);",
    "  float glow = exp(-d * d * 3.0);",
    "  float glow2 = exp(-d * d * 12.0);",
    "  vec3 base = vec3(0.012, 0.014, 0.030);",
    "  vec3 neb  = vec3(0.16, 0.07, 0.30);",
    "  vec3 hot  = vec3(0.30, 0.14, 0.42);",
    "  vec3 c = base + neb * glow * 0.55 + hot * glow2 * 0.35;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"
  ].join("\n");

  var FS_BRIGHT = [
    "precision mediump float;",
    "uniform sampler2D uTex;",
    "uniform float uThresh;",
    "uniform float uGain;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(uTex, vUv).rgb;",
    "  float l = max(max(c.r, c.g), c.b);",
    "  float k = max(0.0, l - uThresh) / max(0.0001, 1.0 - uThresh);",
    "  gl_FragColor = vec4(c * k * uGain, 1.0);",
    "}"
  ].join("\n");

  var FS_COPY = [
    "precision mediump float;",
    "uniform sampler2D uTex;",
    "varying vec2 vUv;",
    "void main(){",
    "  gl_FragColor = vec4(texture2D(uTex, vUv).rgb, 1.0);",
    "}"
  ].join("\n");

  var FS_BLUR = [
    "precision mediump float;",
    "uniform sampler2D uTex;",
    "uniform vec2 uDir;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec3 sum = texture2D(uTex, vUv).rgb * 0.227027;",
    "  vec2 o1 = uDir * 1.3846154;",
    "  vec2 o2 = uDir * 3.2307692;",
    "  sum += (texture2D(uTex, vUv + o1).rgb + texture2D(uTex, vUv - o1).rgb) * 0.3162162;",
    "  sum += (texture2D(uTex, vUv + o2).rgb + texture2D(uTex, vUv - o2).rgb) * 0.0702703;",
    "  gl_FragColor = vec4(sum, 1.0);",
    "}"
  ].join("\n");

  var FS_FINAL = [
    "precision mediump float;",
    "uniform sampler2D uScene;",
    "uniform sampler2D uB1;",
    "uniform sampler2D uB2;",
    "uniform sampler2D uB3;",
    "uniform float uExposure;",
    "uniform float uStrength;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec3 s = texture2D(uScene, vUv).rgb * uExposure;",
    "  vec3 b = texture2D(uB1, vUv).rgb * 0.55",
    "         + texture2D(uB2, vUv).rgb * 0.75",
    "         + texture2D(uB3, vUv).rgb * 1.05;",
    "  vec3 c = s + b * uStrength;",
    "  c = c / (vec3(1.0) + c);",
    "  c = pow(max(c, 0.0), vec3(0.92));",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"
  ].join("\n");

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error("shader: " + gl.getShaderInfoLog(s));
    }
    return s;
  }

  function program(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error("link: " + gl.getProgramInfoLog(p));
    }
    return p;
  }

  var progPoints = program(VS_POINTS, FS_POINTS);
  var progBG = program(VS_QUAD, FS_BG);
  var progBright = program(VS_QUAD, FS_BRIGHT);
  var progCopy = program(VS_QUAD, FS_COPY);
  var progBlur = program(VS_QUAD, FS_BLUR);
  var progFinal = program(VS_QUAD, FS_FINAL);

  var U = {
    view: gl.getUniformLocation(progPoints, "uView"),
    proj: gl.getUniformLocation(progPoints, "uProj"),
    time: gl.getUniformLocation(progPoints, "uTime"),
    scale: gl.getUniformLocation(progPoints, "uScale"),
    bgRes: gl.getUniformLocation(progBG, "uRes"),
    bTex: gl.getUniformLocation(progBright, "uTex"),
    bThresh: gl.getUniformLocation(progBright, "uThresh"),
    bGain: gl.getUniformLocation(progBright, "uGain"),
    cTex: gl.getUniformLocation(progCopy, "uTex"),
    lTex: gl.getUniformLocation(progBlur, "uTex"),
    lDir: gl.getUniformLocation(progBlur, "uDir"),
    fScene: gl.getUniformLocation(progFinal, "uScene"),
    fB1: gl.getUniformLocation(progFinal, "uB1"),
    fB2: gl.getUniformLocation(progFinal, "uB2"),
    fB3: gl.getUniformLocation(progFinal, "uB3"),
    fExposure: gl.getUniformLocation(progFinal, "uExposure"),
    fStrength: gl.getUniformLocation(progFinal, "uStrength")
  };

  /* ------------------------------------------------------------ 粒子生成器 */
  var H_TREE = 3.35;
  var R_TREE = 1.30;

  function lerp(a, b, t) { return a + (b - a) * t; }

  var TREE_STOPS = [
    [0.00, 1.00, 0.42, 0.90],
    [0.14, 0.86, 0.72, 1.00],
    [0.34, 0.24, 0.96, 1.00],
    [0.60, 0.06, 0.96, 0.50],
    [1.00, 0.02, 0.80, 0.26]
  ];

  function treeColor(t, out) {
    var i = 0;
    while (i < TREE_STOPS.length - 2 && t > TREE_STOPS[i + 1][0]) i++;
    var a = TREE_STOPS[i], b = TREE_STOPS[i + 1];
    var k = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
    k = k < 0 ? 0 : (k > 1 ? 1 : k);
    out[0] = lerp(a[1], b[1], k);
    out[1] = lerp(a[2], b[2], k);
    out[2] = lerp(a[3], b[3], k);
  }

  function buildParticles() {
    var total = CFG.tree + CFG.trunk + CFG.heart + CFG.ground + CFG.stars + CFG.snow;
    var data = new Float32Array(total * 9);
    var o = 0;
    var col = [0, 0, 0];
    var i, t, ang, rad, x, y, z, fade;

    function push(px, py, pz, r, g, b, size, phase, speed) {
      data[o++] = px; data[o++] = py; data[o++] = pz;
      data[o++] = r;  data[o++] = g;  data[o++] = b;
      data[o++] = size; data[o++] = phase; data[o++] = speed;
    }

    // ---- 树体：5 层锯齿锥面
    var TIERS = 5.0;
    for (i = 0; i < CFG.tree; i++) {
      t = Math.sqrt(Math.random());
      var tl = t * TIERS;
      var frac = tl - Math.floor(tl);
      var yT = (1 - t) * H_TREE;
      var ring = R_TREE * Math.pow(t + 0.03, 0.92) * (0.68 + 0.32 * frac);
      ang = Math.random() * Math.PI * 2;
      rad = ring * (0.88 + 0.12 * Math.random());
      x = Math.cos(ang) * rad;
      z = Math.sin(ang) * rad;
      y = yT - 0.055 * frac + (Math.random() - 0.5) * 0.05;
      treeColor(t, col);

      var sparkle = Math.random() < 0.045;
      var size = sparkle ? 0.020 + 0.014 * Math.random() : 0.0085 + 0.0090 * Math.random();
      fade = sparkle ? 0.78 + 0.35 * Math.random() : 0.30 + 0.26 * Math.random();
      if (sparkle) { col[0] = 1.0; col[1] = 0.99; col[2] = 1.0; }
      push(x, y, z, col[0] * fade, col[1] * fade, col[2] * fade, size, Math.random(), 0.0);
    }

    // ---- 树干
    for (i = 0; i < CFG.trunk; i++) {
      ang = Math.random() * Math.PI * 2;
      rad = 0.075 * Math.sqrt(Math.random());
      y = Math.random() * 0.40 - 0.08;
      fade = 0.22 + 0.18 * Math.random();
      push(Math.cos(ang) * rad, y, Math.sin(ang) * rad,
           0.80 * fade, 0.56 * fade, 0.30 * fade, 0.010 + 0.008 * Math.random(), Math.random(), 0.0);
    }

    // ---- 顶端爱心（隐式方程拒绝采样，均匀填充）
    var heartY = H_TREE + 0.60, heartS = 0.44;
    for (i = 0; i < CFG.heart; i++) {
      var hx = 0, hy = 0, fv = 1, guard = 0;
      do {
        hx = Math.random() * 2.5 - 1.25;
        hy = Math.random() * 2.2 - 1.05;
        var q = hx * hx + hy * hy - 1.0;
        fv = q * q * q - hx * hx * hy * hy * hy;
        guard++;
      } while (fv > 0 && guard < 80);

      var w = Math.min(1, Math.hypot(hx, hy) / 1.15);
      var core = 1 - w;
      fade = 0.58 + 0.46 * core;
      push(hx * heartS, heartY + hy * heartS, (Math.random() - 0.5) * 0.10,
           1.00 * fade, lerp(0.90, 0.30, w) * fade, lerp(1.00, 0.85, w) * fade,
           0.010 + 0.010 * Math.random(), Math.random(), 0.0);
    }

    // ---- 地面雪
    for (i = 0; i < CFG.ground; i++) {
      ang = Math.random() * Math.PI * 2;
      rad = 5.2 * Math.sqrt(Math.random());
      x = Math.cos(ang) * rad;
      z = Math.sin(ang) * rad;
      y = -0.02 + Math.random() * 0.04;
      fade = (0.20 + 0.35 * Math.random()) * Math.max(0, 1 - rad / 6.2);
      push(x, y, z, 0.40 * fade, 0.58 * fade, 1.00 * fade,
           0.007 + 0.007 * Math.random(), Math.random(), 0.0);
    }

    // ---- 背景星空
    for (i = 0; i < CFG.stars; i++) {
      ang = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      var R = 44;
      x = R * Math.sin(phi) * Math.cos(ang);
      y = R * Math.cos(phi) * 0.6 + 5;
      z = R * Math.sin(phi) * Math.sin(ang);
      fade = 0.45 + 1.05 * Math.random();
      var warm = Math.random() < 0.22;
      push(x, y, z,
           (warm ? 1.0 : 0.80) * fade, (warm ? 0.92 : 0.88) * fade, (warm ? 0.85 : 1.0) * fade,
           0.034 + 0.040 * Math.random(), Math.random(), 0.0);
    }

    // ---- 飘雪
    for (i = 0; i < CFG.snow; i++) {
      ang = Math.random() * Math.PI * 2;
      rad = 5.0 * Math.sqrt(Math.random());
      fade = 0.45 + 0.55 * Math.random();
      push(Math.cos(ang) * rad, Math.random() * 7.0, Math.sin(ang) * rad,
           0.85 * fade, 0.92 * fade, 1.0 * fade,
           0.006 + 0.006 * Math.random(), Math.random(), 0.28 + 0.62 * Math.random());
    }

    return data;
  }

  var particleData = buildParticles();
  var particleCount = particleData.length / 9;

  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, particleData, gl.STATIC_DRAW);

  var A = {
    pos: gl.getAttribLocation(progPoints, "aPos"),
    col: gl.getAttribLocation(progPoints, "aCol"),
    size: gl.getAttribLocation(progPoints, "aSize"),
    phase: gl.getAttribLocation(progPoints, "aPhase"),
    speed: gl.getAttribLocation(progPoints, "aSpeed")
  };

  var STRIDE = 9 * 4;
  function bindPoints() {
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.enableVertexAttribArray(A.pos);   gl.vertexAttribPointer(A.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.enableVertexAttribArray(A.col);   gl.vertexAttribPointer(A.col, 3, gl.FLOAT, false, STRIDE, 12);
    gl.enableVertexAttribArray(A.size);  gl.vertexAttribPointer(A.size, 1, gl.FLOAT, false, STRIDE, 24);
    gl.enableVertexAttribArray(A.phase); gl.vertexAttribPointer(A.phase, 1, gl.FLOAT, false, STRIDE, 28);
    gl.enableVertexAttribArray(A.speed); gl.vertexAttribPointer(A.speed, 1, gl.FLOAT, false, STRIDE, 32);
  }

  var quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  /* --------------------------------------------------------------- 渲染目标 */
  function makeTarget(w, h, useFloat) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    var internalFmt = gl.RGBA, type = gl.UNSIGNED_BYTE;
    if (useFloat) {
      if (isWebGL2) { internalFmt = gl.RGBA16F; type = gl.HALF_FLOAT; }
      else { internalFmt = gl.RGBA; type = gl.getExtension("OES_texture_half_float").HALF_FLOAT_OES; }
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFmt, w, h, 0, gl.RGBA, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok && useFloat) {
      gl.deleteTexture(tex); gl.deleteFramebuffer(fb);
      return makeTarget(w, h, false);
    }
    return { tex: tex, fb: fb, w: w, h: h, ok: ok };
  }

  function freeTarget(t) {
    if (!t) return;
    gl.deleteTexture(t.tex);
    gl.deleteFramebuffer(t.fb);
  }

  var W = 1, H = 1;
  var sceneT = null, b1 = null, b2 = null, b3 = null, tmpA = null, tmpB = null, tmpC = null;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
    var cw = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    var ch = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (cw === W && ch === H && sceneT) return;
    W = cw; H = ch;
    canvas.width = W;
    canvas.height = H;

    freeTarget(sceneT); freeTarget(b1); freeTarget(b2); freeTarget(b3);
    freeTarget(tmpA); freeTarget(tmpB); freeTarget(tmpC);

    sceneT = makeTarget(W, H, floatOK);
    var h1x = Math.max(2, W >> 1), h1y = Math.max(2, H >> 1);
    var h2x = Math.max(2, W >> 2), h2y = Math.max(2, H >> 2);
    var h3x = Math.max(2, W >> 3), h3y = Math.max(2, H >> 3);

    b1 = makeTarget(h1x, h1y, floatOK);
    b2 = makeTarget(h2x, h2y, floatOK);
    b3 = makeTarget(h3x, h3y, floatOK);
    tmpA = makeTarget(h1x, h1y, floatOK);
    tmpB = makeTarget(h2x, h2y, floatOK);
    tmpC = makeTarget(h3x, h3y, floatOK);
  }

  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  /* ---------------------------------------------------------------- 交互 */
  var az = 0.30, el = 0.20, dist = 10.2;
  var autoSpin = true, dragging = false;
  var points = new Map();
  var lastPinch = 0;
  var spinTimer = 0;

  function markInteraction() {
    autoSpin = false;
    clearTimeout(spinTimer);
    spinTimer = setTimeout(function () { autoSpin = true; }, 3500);
    document.getElementById("hint").classList.add("hide");
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    points.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragging = true;
    canvas.classList.add("dragging");
    lastPinch = 0;
    markInteraction();
  });

  canvas.addEventListener("pointermove", function (e) {
    var p = points.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (points.size >= 2) {
      var arr = Array.from(points.values());
      var d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      if (lastPinch > 0) {
        dist *= lastPinch / Math.max(1, d);
        dist = Math.min(20, Math.max(4.5, dist));
      }
      lastPinch = d;
    } else {
      az -= dx * 0.006;
      el += dy * 0.004;
      el = Math.max(-0.30, Math.min(1.10, el));
    }
    markInteraction();
  });

  function release(e) {
    points.delete(e.pointerId);
    if (points.size === 0) {
      dragging = false;
      canvas.classList.remove("dragging");
    }
    lastPinch = 0;
  }
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    dist *= Math.exp(e.deltaY * 0.0012);
    dist = Math.min(20, Math.max(4.5, dist));
    markInteraction();
  }, { passive: false });

  setTimeout(function () {
    document.getElementById("hint").classList.add("hide");
  }, 6000);

  /* ---------------------------------------------------------------- 绘制工具 */
  var aQuadBG = gl.getAttribLocation(progBG, "aP");
  var aQuadBright = gl.getAttribLocation(progBright, "aP");
  var aQuadCopy = gl.getAttribLocation(progCopy, "aP");
  var aQuadBlur = gl.getAttribLocation(progBlur, "aP");
  var aQuadFinal = gl.getAttribLocation(progFinal, "aP");

  function bindQuad(a) {
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  }

  // 对 src 做一次水平+垂直高斯模糊，结果留在 src 里（tmp 需与 src 同尺寸）
  function blurInPlace(src, tmp) {
    gl.useProgram(progBlur);
    gl.uniform1i(U.lTex, 0);
    gl.activeTexture(gl.TEXTURE0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, tmp.fb);
    gl.viewport(0, 0, tmp.w, tmp.h);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(U.lDir, 1.0 / src.w, 0);
    bindQuad(aQuadBlur);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, src.fb);
    gl.viewport(0, 0, src.w, src.h);
    gl.bindTexture(gl.TEXTURE_2D, tmp.tex);
    gl.uniform2f(U.lDir, 0, 1.0 / src.h);
    bindQuad(aQuadBlur);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function copyTo(src, dst) {
    gl.useProgram(progCopy);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(U.cTex, 0);
    bindQuad(aQuadCopy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ---------------------------------------------------------------- 主循环 */
  var startTime = performance.now();
  var lastFrame = startTime;
  var fpsAccum = 0, fpsCount = 0, dropped = false;

  function frame(now) {
    requestAnimationFrame(frame);

    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    var time = (now - startTime) / 1000;

    fpsAccum += dt; fpsCount++;
    if (!dropped && fpsCount > 90) {
      if (fpsAccum / fpsCount > 1 / 26) {
        CFG.dprCap = Math.max(1.0, CFG.dprCap * 0.7);
        dropped = true;
        W = H = 0; resize();
      }
      fpsAccum = 0; fpsCount = 0;
    }

    resize();
    if (!sceneT || !sceneT.ok) return;

    if (autoSpin && !dragging) az += dt * 0.10;

    var aspect = W / Math.max(1, H);
    var proj = perspective(36, aspect, 0.1, 140);
    var fit = aspect >= 1.3 ? 1.0 : (aspect >= 1.0 ? 1.12 : (aspect >= 0.75 ? 1.32 : 1.55));
    var dEff = dist * fit;
    var cx = Math.cos(el) * Math.sin(az) * dEff;
    var cy = Math.sin(el) * dEff + 1.85;
    var cz = Math.cos(el) * Math.cos(az) * dEff;
    var view = lookAt(cx, cy, cz, 0, 1.85, 0, 0, 1, 0);

    /* ---- 1. 场景：背景渐变 + 粒子 ---- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneT.fb);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);

    gl.useProgram(progBG);
    gl.uniform2f(U.bgRes, W, H);
    bindQuad(aQuadBG);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(progPoints);
    bindPoints();
    gl.uniformMatrix4fv(U.view, false, view);
    gl.uniformMatrix4fv(U.proj, false, proj);
    gl.uniform1f(U.time, time);
    gl.uniform1f(U.scale, 0.5 * H / Math.tan(36 * Math.PI / 360));
    gl.drawArrays(gl.POINTS, 0, particleCount);
    gl.disable(gl.BLEND);

    /* ---- 2. 亮部提取（降到 1/2）---- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, b1.fb);
    gl.viewport(0, 0, b1.w, b1.h);
    gl.useProgram(progBright);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1i(U.bTex, 0);
    gl.uniform1f(U.bThresh, 0.78);
    gl.uniform1f(U.bGain, 1.0);
    bindQuad(aQuadBright);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    /* ---- 3. 三级模糊（每级先降采样再模糊）---- */
    blurInPlace(b1, tmpA);                 // 1/2 分辨率
    copyTo(b1, b2); blurInPlace(b2, tmpB); // 1/4 分辨率
    copyTo(b2, b3); blurInPlace(b3, tmpC); // 1/8 分辨率

    /* ---- 4. 合成 ---- */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(progFinal);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
    gl.uniform1i(U.fScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, tmpA.tex);
    gl.uniform1i(U.fB1, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, b2.tex);
    gl.uniform1i(U.fB2, 2);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, b3.tex);
    gl.uniform1i(U.fB3, 3);
    gl.uniform1f(U.fExposure, 0.95);
    gl.uniform1f(U.fStrength, 0.75);
    bindQuad(aQuadFinal);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
